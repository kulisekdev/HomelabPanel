<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* Base reset & body */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background-color: #0a0a0a;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            border-bottom: 1px solid #262626;
        }

        .header-container {
            max-width: 72rem;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
        }

        .brand-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #3b82f6;
        }

        .server-info {
            text-align: right;
            font-size: 0.75rem;
            color: #737373;
        }

        /* Main layout */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.5rem;
            min-height: calc(100vh - 113px);
        }

        .login-wrapper {
            width: 100%;
            max-width: 24rem;
        }

        .card {
            border-radius: 0.5rem;
            border: 1px solid #262626;
            background-color: #171717;
            padding: 1.75rem;
        }

        .card-header {
            margin-bottom: 1.75rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f5f5f5;
        }

        .card-subtitle {
            margin-top: 0.375rem;
            font-size: 0.875rem;
            color: #737373;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #d4d4d4;
        }

        .form-input {
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid #404040;
            background-color: #0a0a0a;
            padding: 0.625rem 0.75rem;
            font-size: 0.875rem;
            color: #f5f5f5;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input::placeholder {
            color: #525252;
        }

        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.5);
        }

        .btn-submit {
            width: 100%;
            border: none;
            border-radius: 0.375rem;
            background-color: #2563eb;
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-submit:hover {
            background-color: #3b82f6;
        }

        .btn-submit:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        .btn-submit:active {
            background-color: #1d4ed8;
        }

        /* Footer */
        footer {
            border-top: 1px solid #262626;
        }

        .footer-content {
            padding: 1rem 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #525252;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-container">

            <span class="brand-title">
                {{ info.title }}
            </span>

            <div class="server-info">
                <div>{{ info.hostname }}</div>
                <div>{{ info.ip }}</div>
            </div>

        </div>
    </header>


    <!-- Login -->
    <main>

        <div class="login-wrapper">

            <div class="card">

                <div class="card-header">
                    <h1 class="card-title">
                        Sign in
                    </h1>

                    <p class="card-subtitle">
                        Enter your password to continue.
                    </p>
                </div>

                <form action="/" method="post">

                    <div class="form-group">
                        <label for="passwd" class="form-label">
                            Password
                        </label>

                        <input
                            id="passwd"
                            type="password"
                            name="passwd"
                            required
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            class="form-input"
                        >
                    </div>

                    <button type="submit" class="btn-submit">
                        Sign in
                    </button>
                    {% if error %}
                    <p style="color: red;">Incorrect Password!</p>
                    {% endif %}
                </form>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <div class="footer-content">
            &copy; 2026 {{ info.footer }}
        </div>
    </footer>

</body>
</html>
